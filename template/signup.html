<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Signup — Website Fixer Game</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-very-light: #fbfbfc;
      --card-white: #ffffff;
      --accent-green: #10b981;
      --accent-green-dark: #059669;
      --accent-pink: #f9c6d1;
      --muted-ink: #374151;
      --glass-border: rgba(16,24,40,0.04);
    }

    html,body { height:100%; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(600px 300px at 12% 18%, rgba(249,198,209,0.28), transparent 12%),
        radial-gradient(500px 250px at 88% 82%, rgba(16,185,129,0.12), transparent 12%),
        linear-gradient(180deg, var(--bg-very-light) 0%, #f7fafc 100%);
      color: var(--muted-ink);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .signup-card {
      width: 100%;
      max-width: 520px;
      border-radius: 14px;
      padding: 2rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,250,0.96));
      border: 1px solid var(--glass-border);
      box-shadow: 0 18px 50px rgba(15,23,42,0.06);
      position: relative;
      overflow: hidden;
    }

    .pink-ribbon {
      position: absolute;
      left: -60px;
      top: -60px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle at 30% 30%, rgba(249,198,209,0.95), rgba(249,198,209,0.55) 40%, transparent 60%);
      transform: rotate(-18deg);
      filter: blur(14px);
      opacity: 0.95;
      pointer-events: none;
      z-index: 0;
    }

    .green-accent {
      position: absolute;
      right: -48px;
      bottom: -48px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle at 30% 30%, rgba(16,185,129,0.14), rgba(16,185,129,0.06) 40%, transparent 60%);
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
      z-index: 0;
    }

    .card-content { position: relative; z-index: 2; }

    .title {
      font-family: "Cinzel", serif;
      color: #0f172a;
      letter-spacing: 0.6px;
      font-size: 1.6rem;
    }
    .subtitle {
      font-family: "Merriweather", serif;
      color: rgba(15,23,42,0.6);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(15,23,42,0.02), rgba(15,23,42,0.01));
      border: 1px solid rgba(15,23,42,0.06);
      color: var(--muted-ink);
      outline: none;
      transition: box-shadow .12s ease, transform .08s ease, border-color .12s ease;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
    }
    .input::placeholder { color: rgba(15,23,42,0.35); }
    .input:focus {
      box-shadow: 0 8px 24px rgba(16,185,129,0.08);
      transform: translateY(-1px);
      border-color: rgba(16,185,129,0.28);
    }

    .btn-green {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0.5rem;
      width:100%;
      padding:0.65rem 0.9rem;
      border-radius:10px;
      background: linear-gradient(90deg, var(--accent-green) 0%, var(--accent-green-dark) 100%);
      color: #ffffff;
      font-weight:700;
      border: none;
      box-shadow: 0 12px 36px rgba(16,185,129,0.12);
      transition: transform .12s ease, box-shadow .12s ease;
      font-family: "Inter", sans-serif;
    }
    .btn-green:hover { transform: translateY(-3px); box-shadow: 0 18px 46px rgba(16,185,129,0.16); }

    .btn-outline-pink {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0.5rem;
      width:100%;
      padding:0.55rem 0.9rem;
      border-radius:10px;
      background: transparent;
      color: #7f1d1d;
      font-weight:700;
      border: 1px solid rgba(249,198,209,0.6);
      transition: transform .12s ease, background .12s ease;
      font-family: "Inter", sans-serif;
    }
    .btn-outline-pink:hover { transform: translateY(-2px); background: rgba(249,198,209,0.08); }

    .error {
      background: linear-gradient(180deg, rgba(254,226,226,0.6), rgba(255,255,255,0.02));
      border: 1px solid rgba(239,68,68,0.08);
      color: #b91c1c;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .helper { font-size: 0.9rem; color: rgba(15,23,42,0.6); font-family: "Merriweather", serif; }

    @media (max-width: 480px) {
      .signup-card { padding: 1.25rem; max-width: 360px; }
      .title { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <div class="signup-card">
    <div class="pink-ribbon" aria-hidden="true"></div>
    <div class="green-accent" aria-hidden="true"></div>

    <div class="card-content">
      <div class="mb-6">
        <div class="title">Create Account</div>
        <div class="subtitle">Register to participate in the Website Fixer challenge</div>
      </div>

      {% if error %}
        <div class="error" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/signup/" novalidate>
        {% csrf_token %}

        <label for="username" class="block text-sm mb-2 helper">Username</label>
        <input id="username" name="username" type="text" required autocomplete="username" class="input mb-4" placeholder="Choose a username" />

        <label for="pc_no" class="block text-sm mb-2 helper">PC Number</label>
        <input id="pc_no" name="pc_no" type="text" required autocomplete="off" class="input mb-4" placeholder="Assigned PC number" />

        <label for="password" class="block text-sm mb-2 helper">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" class="input mb-4" placeholder="Create a password" />

        <div class="flex items-center gap-3 mb-4">
          <button type="submit" class="btn-green">Sign Up</button>
          <a href="/login/" class="btn-outline-pink">Login</a>
        </div>

        <div class="text-xs helper mb-2">By signing up you agree to follow the event rules. For help contact the admin.</div>

        <div class="mt-2 text-center">
          <a href="/" class="text-sm" style="color:var(--accent-green); text-decoration:underline;">Return to home</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
